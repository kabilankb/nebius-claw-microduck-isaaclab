  </g>
  <text x="520" y="981" font-size="14" text-anchor="middle">Nemotron 3.5 Super VL</text>
  <text x="520" y="999" font-size="11" fill="#555" text-anchor="middle">watches the gait video</text>

  <g transform="translate(780,935)" fill="none" stroke="#111" stroke-width="2.5">
