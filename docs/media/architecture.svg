<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1030" viewBox="0 0 2000 1030" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <g id="gear">
      <circle r="9" fill="none" stroke="#76B900" stroke-width="2.4"/>
      <circle r="3.5" fill="none" stroke="#76B900" stroke-width="2"/>
      <g stroke="#76B900" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-13" x2="0" y2="-10"/><line x1="0" y1="10" x2="0" y2="13"/>
        <line x1="-13" y1="0" x2="-10" y2="0"/><line x1="10" y1="0" x2="13" y2="0"/>
        <line x1="-9.2" y1="-9.2" x2="-7.1" y2="-7.1"/><line x1="7.1" y1="7.1" x2="9.2" y2="9.2"/>
        <line x1="-9.2" y1="9.2" x2="-7.1" y2="7.1"/><line x1="7.1" y1="-7.1" x2="9.2" y2="-9.2"/>
      </g>
    </g>
    <g id="agent">
      <line x1="0" y1="-34" x2="0" y2="-26" stroke="#111" stroke-width="3"/>
      <circle cx="0" cy="-37" r="4" fill="#76B900"/>
      <rect x="-28" y="-26" width="56" height="44" rx="12" fill="#fff" stroke="#111" stroke-width="3"/>
      <circle cx="-11" cy="-5" r="5.5" fill="#111"/><circle cx="11" cy="-5" r="5.5" fill="#111"/>
      <path d="M-10,8 Q0,14 10,8" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="-20" y="20" width="40" height="12" rx="4" fill="#111"/>
    </g>
  </defs>

  <rect width="2000" height="1030" fill="#fff"/>

  <!-- ============ Host machine ============ -->
  <rect x="160" y="20" width="1465" height="790" fill="none" stroke="#c9c9c9" stroke-width="3"/>
  <text x="1605" y="795" font-size="17" font-weight="700" text-anchor="end">Host Machine · laptop with RTX GPU</text>

  <!-- User -->
  <g transform="translate(80,400)">
    <circle cx="0" cy="-22" r="16" fill="none" stroke="#111" stroke-width="3"/>
    <path d="M-28,24 Q-28,-2 0,-2 Q28,-2 28,24 z" fill="none" stroke="#111" stroke-width="3"/>
  </g>
  <text x="80" y="452" font-size="16" text-anchor="middle">You</text>
  <text x="80" y="472" font-size="12" fill="#555" text-anchor="middle">browser · terminal</text>

  <!-- Entry points -->
  <rect x="190" y="150" width="150" height="90" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="265" y="184" font-size="16" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace">./duck</text>
  <text x="265" y="206" font-size="12" fill="#444" text-anchor="middle">run · ship · watch</text>
  <text x="265" y="223" font-size="12" fill="#444" text-anchor="middle">deploy · chat</text>

  <rect x="190" y="440" width="150" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="265" y="474" font-size="16" font-weight="600" text-anchor="middle">Web Console</text>
  <text x="265" y="494" font-size="12" fill="#444" text-anchor="middle">:8800 · key · model</text>
  <text x="265" y="511" font-size="12" fill="#444" text-anchor="middle">switcher · 3D viewer</text>
  <text x="265" y="528" font-size="12" fill="#444" text-anchor="middle">stats · tune · replay</text>
  <text x="265" y="545" font-size="12" fill="#444" text-anchor="middle">gait critique</text>

  <!-- user → entries -->
  <path d="M120,400 H150 M150,195 V500" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M150,195 H188" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <path d="M150,500 H188" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>

  <!-- ============ Sandbox: duckpilot ============ -->
  <rect x="375" y="70" width="665" height="390" fill="none" stroke="#555" stroke-width="3"/>
  <text x="1025" y="96" font-size="16" font-weight="700" text-anchor="end">OpenShell Sandbox · duckpilot</text>

  <use href="#agent" transform="translate(470,300)"/>
  <text x="470" y="355" font-size="15" text-anchor="middle">Hermes Agent</text>
  <text x="470" y="373" font-size="12" fill="#555" text-anchor="middle">“Duck pilot”</text>

  <rect x="600" y="115" width="290" height="125" fill="#fff" stroke="#76B900" stroke-width="2.5"/>
  <text x="745" y="142" font-size="15" text-anchor="middle">duck-pilot Skill</text>
  <use href="#gear" transform="translate(862,138)"/>
  <text x="622" y="174" font-size="12">Pick the tool, pass on every number</text>
  <text x="622" y="196" font-size="12">Relay the status card verbatim</text>
  <text x="622" y="218" font-size="12">Never deploy before “it’s on its stand”</text>

  <rect x="600" y="275" width="290" height="150" fill="#fff" stroke="#76B900" stroke-width="2.5"/>
  <text x="745" y="302" font-size="15" text-anchor="middle">Isaac MCP Tools</text>
  <use href="#gear" transform="translate(862,298)"/>
  <text x="622" y="334" font-size="12" font-family="Menlo, Consolas, monospace">duck_pipeline_start</text>
  <text x="622" y="356" font-size="12" font-family="Menlo, Consolas, monospace">duck_pipeline_status</text>
  <text x="622" y="378" font-size="12" font-family="Menlo, Consolas, monospace">duck_deploy_confirm</text>
  <text x="622" y="400" font-size="12" font-family="Menlo, Consolas, monospace">duck_pipeline_stop</text>

  <path d="M470,262 V165 H598" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <path d="M500,300 H560 V350 H598" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="530" y="158" font-size="10">loads</text>
  <text x="566" y="343" font-size="10">calls</text>

  <!-- ============ Sandbox: isaacsim ============ -->
  <rect x="375" y="490" width="665" height="290" fill="none" stroke="#555" stroke-width="3"/>
  <text x="1025" y="516" font-size="16" font-weight="700" text-anchor="end">OpenShell Sandbox · isaacsim</text>

  <use href="#agent" transform="translate(470,640)"/>
  <text x="470" y="695" font-size="15" text-anchor="middle">OpenClaw Agent</text>
  <text x="470" y="713" font-size="12" fill="#555" text-anchor="middle">“Claw”</text>

  <rect x="600" y="535" width="290" height="185" fill="#fff" stroke="#76B900" stroke-width="2.5"/>
  <text x="745" y="562" font-size="15" text-anchor="middle">Isaac MCP Tools</text>
  <use href="#gear" transform="translate(862,558)"/>
  <text x="622" y="594" font-size="12" font-family="Menlo, Consolas, monospace">train_task · stop</text>
  <text x="622" y="616" font-size="12" font-family="Menlo, Consolas, monospace">training_status</text>
  <text x="622" y="638" font-size="12" font-family="Menlo, Consolas, monospace">tuning_guide</text>
  <text x="622" y="660" font-size="12" font-family="Menlo, Consolas, monospace">play_policy</text>
  <text x="622" y="682" font-size="12" font-family="Menlo, Consolas, monospace">list_environments</text>
  <text x="622" y="704" font-size="11" fill="#555">G1 · H1 · Go2 · Cassie · ANYmal-D</text>

  <path d="M500,640 H598" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="530" y="632" font-size="10">calls</text>

  <!-- entries → agents -->
  <path d="M340,195 H425 V290 H438" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="350" y="187" font-size="10">ask · chat</text>
  <path d="M340,470 H405 V312 H438" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="346" y="462" font-size="10">chat</text>
  <path d="M340,530 H415 V640 H438" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="346" y="522" font-size="10">chat</text>

  <!-- ============ L7 proxy (OpenShell gateway) ============ -->
  <rect x="1080" y="300" width="40" height="470" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <g transform="translate(1100,255)" stroke="#111" stroke-width="3" fill="none">
    <rect x="-22" y="-6" width="9" height="9" fill="#111"/>
    <path d="M-13,-2 H-4 M-4,-18 V14 M-4,-18 H6 M-4,-2 H6 M-4,14 H6"/>
    <rect x="8" y="-22" width="9" height="9" fill="#111"/><rect x="8" y="-6" width="9" height="9" fill="#111"/><rect x="8" y="10" width="9" height="9" fill="#111"/>
  </g>
  <g transform="translate(1100,535) rotate(-90)">
    <text x="0" y="6" font-size="15" text-anchor="middle">L7 Proxy · OpenShell gateway :8090</text>
  </g>
  <text x="1130" y="765" font-size="11" fill="#555">deny-by-default egress</text>

  <!-- sandboxes → proxy -->
  <path d="M890,350 H1078" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="905" y="342" font-size="10">HTTP :5561 (allow-listed)</text>
  <path d="M470,380 V440 H1078" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="905" y="432" font-size="10">Inference</text>
  <path d="M890,628 H1078" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="905" y="620" font-size="10">HTTP :5561 (allow-listed)</text>
  <path d="M470,720 V750 H1078" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="905" y="742" font-size="10">Inference</text>

  <!-- proxy → control server -->
  <path d="M1120,628 H1200 V350 M1120,350 H1200 V190 H1258" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="1130" y="342" font-size="10">HTTP REST</text>

  <!-- ./duck → control server (direct) -->
  <path d="M265,150 V45 H1440 V68" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="700" y="38" font-size="10">HTTP REST · run · ship · status · watch · deploy · stop</text>

  <!-- ============ Host services ============ -->
  <rect x="1260" y="70" width="340" height="215" fill="#fff" stroke="#111" stroke-width="2"/>
  <g transform="translate(1290,104)" fill="none" stroke="#111" stroke-width="2.5">
    <rect x="-14" y="-16" width="28" height="10" rx="2"/><rect x="-14" y="-3" width="28" height="10" rx="2"/><rect x="-14" y="10" width="28" height="10" rx="2"/>
  </g>
  <text x="1440" y="100" font-size="16" font-weight="600" text-anchor="middle">Isaac Control Server :5561</text>
  <text x="1440" y="120" font-size="12" fill="#555" text-anchor="middle">one GPU job at a time · renders the status cards</text>
  <g font-size="11" text-anchor="middle">
    <rect x="1278" y="140" width="64" height="26" rx="4" fill="#f2f8e6" stroke="#76B900"/><text x="1310" y="157">train</text>
    <rect x="1358" y="140" width="64" height="26" rx="4" fill="#f2f8e6" stroke="#76B900"/><text x="1390" y="157">gate</text>
    <rect x="1438" y="140" width="64" height="26" rx="4" fill="#f2f8e6" stroke="#76B900"/><text x="1470" y="157">play</text>
    <rect x="1518" y="140" width="64" height="26" rx="4" fill="#f2f8e6" stroke="#76B900"/><text x="1550" y="157">verify</text>
  </g>
  <path d="M1342,153 H1356 M1422,153 H1436 M1502,153 H1516" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M1390,166 V190 H1310 V168" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="1350" y="204" font-size="10" text-anchor="middle">fails → tune (lr × 0.7) → retrain</text>
  <text x="1278" y="232" font-size="11" fill="#444">Gate: fall rate ≤ 25 %, not reward alone</text>
  <text x="1278" y="252" font-size="11" fill="#444">Up to 4 generations · resumes from the checkpoint</text>
  <text x="1278" y="272" font-size="11" fill="#444">Deploy waits for robot_on_stand = true</text>

  <rect x="1260" y="335" width="340" height="125" fill="#fff" stroke="#111" stroke-width="2"/>
  <g transform="translate(1290,370)" fill="none" stroke="#111" stroke-width="2.5">
    <rect x="-13" y="-13" width="26" height="26" rx="3"/><rect x="-6" y="-6" width="12" height="12" fill="#76B900" stroke="none"/>
    <path d="M-7,-13 V-19 M0,-13 V-19 M7,-13 V-19 M-7,13 V19 M0,13 V19 M7,13 V19 M-13,-7 H-19 M-13,0 H-19 M-13,7 H-19 M13,-7 H19 M13,0 H19 M13,7 H19" stroke-width="2"/>
  </g>
  <text x="1440" y="366" font-size="16" font-weight="600" text-anchor="middle">Isaac Lab 3 · RTX GPU</text>
  <text x="1440" y="386" font-size="12" fill="#555" text-anchor="middle">rsl_rl PPO · 4,096 parallel MicroDucks</text>
  <text x="1440" y="412" font-size="12" fill="#444" text-anchor="middle">MicroDuck flat / rough (presets=backlash)</text>
  <text x="1440" y="432" font-size="12" fill="#444" text-anchor="middle">G1 · H1 · Go2 · Cassie · ANYmal-D</text>
  <text x="1440" y="450" font-size="12" fill="#444" text-anchor="middle">viser 3D viewer :8012 · mp4 + ONNX export</text>

  <path d="M1440,285 V333" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="1448" y="314" font-size="10">launch train / play</text>

  <rect x="1260" y="510" width="160" height="130" fill="#fff" stroke="#111" stroke-width="2"/>
  <g transform="translate(1340,540)" fill="none" stroke="#76B900" stroke-width="2.5">
    <path d="M0,-16 L14,-10 V2 Q14,12 0,18 Q-14,12 -14,2 V-10 z"/><path d="M-6,1 L-1,6 L7,-4"/>
  </g>
  <text x="1340" y="580" font-size="14" font-weight="600" text-anchor="middle">Verify</text>
  <text x="1340" y="598" font-size="11" fill="#555" text-anchor="middle">9 sim-to-real checks</text>
  <text x="1340" y="614" font-size="11" fill="#555" text-anchor="middle">61 → 14 · ONNX ≡ torch</text>
  <text x="1340" y="630" font-size="11" fill="#555" text-anchor="middle">single file &lt; 64 MiB</text>

  <rect x="1440" y="510" width="160" height="130" fill="#fff" stroke="#111" stroke-width="2"/>
  <g transform="translate(1520,540)" fill="none" stroke="#111" stroke-width="2.5">
    <path d="M-15,-8 L0,-16 L15,-8 V10 L0,18 L-15,10 z M-15,-8 L0,0 L15,-8 M0,0 V18"/>
  </g>
  <text x="1520" y="580" font-size="14" font-weight="600" text-anchor="middle">Deploy bundle</text>
  <text x="1520" y="598" font-size="11" fill="#555" text-anchor="middle">policy.onnx</text>
  <text x="1520" y="614" font-size="11" fill="#555" text-anchor="middle">manifest.json</text>
  <text x="1520" y="630" font-size="11" fill="#555" text-anchor="middle">DEPLOY.md</text>

  <path d="M1340,460 V508" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="1348" y="489" font-size="10">exported policy</text>
  <path d="M1420,575 H1438" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>

  <!-- ============ Real robot ============ -->
  <rect x="1675" y="410" width="300" height="280" fill="none" stroke="#76B900" stroke-width="3"/>
  <text x="1960" y="438" font-size="16" font-weight="700" text-anchor="end">Real Robot</text>
  <g transform="translate(1825,520)" stroke="#111" stroke-width="3" fill="#fff">
    <path d="M-38,10 Q-40,-14 -12,-14 L10,-14 Q10,-30 24,-34 Q40,-36 40,-20 Q40,-8 28,-6 L30,12 Q24,30 -6,30 Q-34,30 -38,10 z"/>
    <path d="M40,-22 L54,-18 L40,-14 z" fill="#76B900" stroke="#111" stroke-width="2"/>
    <circle cx="28" cy="-24" r="3" fill="#111" stroke="none"/>
    <path d="M-10,30 V44 M10,30 V44 M-16,44 H-4 M4,44 H16"/>
  </g>
  <text x="1825" y="598" font-size="16" text-anchor="middle">MicroDuck</text>
  <text x="1825" y="622" font-size="12" font-family="Menlo, Consolas, monospace" text-anchor="middle">robotctl policy load walk</text>
  <text x="1825" y="642" font-size="11" fill="#555" text-anchor="middle">rollback: robotctl policy reset walk</text>
  <text x="1825" y="668" font-size="11" fill="#555" text-anchor="middle">DUCK_HOST unset → dry run bundle</text>

  <path d="M1600,575 H1673" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="1606" y="560" font-size="10">scp + robotctl</text>
  <text x="1606" y="596" font-size="10">only after</text>
  <text x="1606" y="609" font-size="10">“on its stand”</text>

  <!-- ============ Nebius Token Factory ============ -->
  <rect x="380" y="850" width="870" height="160" fill="none" stroke="#c4d600" stroke-width="3"/>
  <text x="1235" y="878" font-size="16" font-weight="700" text-anchor="end">Nebius Token Factory</text>
  <text x="1235" y="898" font-size="11" fill="#555" text-anchor="end">api.tokenfactory.nebius.com/v1 · OpenAI-compatible</text>

  <g transform="translate(520,935)" fill="none" stroke="#111" stroke-width="2.5">
