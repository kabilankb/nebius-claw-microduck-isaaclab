  </g>
  <text x="780" y="981" font-size="14" text-anchor="middle">Nemotron 3 Super 120B</text>
  <text x="780" y="999" font-size="11" fill="#555" text-anchor="middle">plans + tool calls (both agents)</text>

  <g transform="translate(1030,935)" fill="none" stroke="#111" stroke-width="2.5">
    <path d="M0,-22 L19,-11 V11 L0,22 L-19,11 V-11 z"/><circle r="6" fill="#76B900" stroke="none"/>
  </g>
  <text x="1030" y="981" font-size="14" text-anchor="middle">Nemotron 3 Nano · Ultra</text>
  <text x="1030" y="999" font-size="11" fill="#555" text-anchor="middle">switchable live from the console</text>

  <!-- proxy → Token Factory -->
  <path d="M1100,770 V820 H780 V910" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
